services:
  postgres:
    image: postgres:16-alpine
    container_name: employee-lead-postgres
    environment:
      POSTGRES_DB: employee_lead
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - employee_lead_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_lead"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  employee_lead_postgres:
